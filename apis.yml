aid: lindus-health
name: Lindus Health
description: Lindus Health is a next-generation contract research organization (CRO) that runs clinical
  trials end to end for biotech and pharmaceutical sponsors. It pairs Citrus, an AI-assisted trial operating
  system connecting patient identification through final data capture, with centralized patient identification
  and enrollment (AI-powered EHR querying, digital pre-screening, centralized patient support), flexible
  site models spanning site-based, hybrid and fully virtual delivery, and integrated clinical services
  from protocol design through database lock. Its platform surface covers EDC, eSource, ePRO/eCOA, eConsent
  and CTMS. The company operates across the US, UK and Europe with APAC partnerships, employs over 160
  staff, and works in cardiometabolic, respiratory, psychiatry, women's health and dermatology. Commercial
  engagements are performance-based with milestone pricing. Lindus Health publishes no public developer
  API, developer portal or API documentation; its public technical footprint is two open-source CDISC
  clinical-data repositories.
